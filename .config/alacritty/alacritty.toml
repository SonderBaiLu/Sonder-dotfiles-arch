[general]
import = ["~/.config/alacritty/themes/catppuccin-frappe.toml"]


[window]
dynamic_padding = true
decorations = "Full"
opacity = 1
blur = true
startup_mode = "Windowed"
title = "Alacritty终端"


[window.dimensions]
columns = 110
lines = 32


[window.padding]
x = 18
y = 16


[window.class]
instance = "Alacritty"
general = "Alacritty"


[scrolling]
history = 10_000
multiplier = 3


[font]
size = 18


[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Bold"


[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"


[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"


[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"


[cursor]
blink_interval = 650


[cursor.style]
shape = "Underline"
blinking = "On"


[terminal.shell]
program = "/usr/bin/fish"


[[mouse.bindings]]
mouse = "Middle"
action = "PasteSelection"


[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"


[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"


[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"


[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"


[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"


[[keyboard.bindings]]
key = "PageUp"
mods = "Shift"
action = "ScrollPageUp"


[[keyboard.bindings]]
key = "PageDown"
mods = "Shift"
action = "ScrollPageDown"


[[keyboard.bindings]]
key = "Home"
mods = "Shift"
action = "ScrollToTop"


[[keyboard.bindings]]
key = "End"
mods = "Shift"
action = "ScrollToBottom"


[debug]
log_level = "Warn"
render_timer = false
