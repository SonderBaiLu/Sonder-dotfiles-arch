# 输入法环境变量（environment.d 机制：systemd 用户管理器启动的所有服务都会继承）。
# 关键消费者：xdg-desktop-portal-gtk（文件选择/保存弹窗）这类由 systemd/D-Bus 激活的
# GTK/Qt 程序——它们的环境不经过 Hyprland，缺了 GTK_IM_MODULE 就无法输入中文。
# 注意：普通 GUI 程序的环境来自 hypr 的 lua/environment.lua，两处需保持一致。

# XIM 协议指向 fcitx（XWayland / 旧式 X11 应用使用）
XMODIFIERS=@im=fcitx

# GTK2/3 工具包的输入法模块名（GTK4 走 Wayland text-input 协议，不依赖此项）
GTK_IM_MODULE=fcitx

# Qt 应用的输入法模块名
QT_IM_MODULE=fcitx

# 通用提示变量，部分工具/脚本读取
INPUT_METHOD=fcitx5
