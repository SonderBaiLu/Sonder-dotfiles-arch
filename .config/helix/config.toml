# Helix 主配置

theme = "catppuccin_frappe"

[editor]
line-number = "relative"
mouse = false
true-color = true
bufferline = "multiple"
completion-trigger-len = 1

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true
character = "│"

[editor.file-picker]
hidden = false
