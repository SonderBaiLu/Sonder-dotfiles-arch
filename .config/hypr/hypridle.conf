# Hypridle 空闲管理配置（净化版）。
# Noctalia 接管锁屏视觉，此处只负责触发锁屏、休眠与 DPMS 关闭屏幕。

general {
    # 空闲触发锁屏：调用 noctalia 内置锁屏（统一由 noctalia 提供锁屏视觉）
    lock_cmd = noctalia msg session lock
    # 睡眠前先锁屏
    before_sleep_cmd = noctalia msg session lock
    # 睡眠唤醒后点亮屏幕
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 300 秒无操作：提示即将锁屏
listener {
    timeout = 300
    on-timeout = notify-send "屏幕将进入锁屏"
}

# 600 秒无操作：挂起系统
listener {
    timeout = 600
    on-timeout = systemctl suspend
    on-resume = notify-send "已从休眠恢复"
}

# 900 秒无操作：关闭显示器背光
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
