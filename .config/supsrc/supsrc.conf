[global]
log_level = "INFO"

# ==========Rust 博客后端项目 ==========
[repositories.Rust_Blog]
path = "~/Documents/Rust项目/Rust_Blog"  # path 必须放在这个层级
enabled = true

[repositories.Rust_Blog.rule]  # 这就是你缺少的 rule 块
type = "supsrc.rules.inactivity"
period = "5m"

[repositories.Rust_Blog.repository]
type = "supsrc.engines.git"
auto_push = true
remote = "origin"
commit_message_template = "chore: auto-sync at {{timestamp}}"

# ========== Rust 博客前端项目 ==========
[repositories.Vue_blog_front-end]
path = "~/Documents/Vue项目/Vue_blog_front-end"
enabled = true

[repositories.Vue_blog_front-end.rule]
type = "supsrc.rules.inactivity"
period = "5m"

[repositories.Vue_blog_front-end.repository]
type = "supsrc.engines.git"
auto_push = true

# ========== 变成学习项目 ==========
[repositories.learning]
path = "~/Documents/learning"
enabled = true

[repositories.learning.rule]
type = "supsrc.rules.inactivity"
period = "5m"

[repositories.learning.repository]
type = "supsrc.engines.git"
auto_push = true
