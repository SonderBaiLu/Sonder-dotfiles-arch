# yazi 主配置。
# 26.x 的预览区位置固定在右侧，无法改成底部，只能用 ratio 调宽度：
# ratio = [ 父目录栏, 当前目录栏, 预览栏 ]，默认 [1, 4, 3]（预览占 37.5%）。
# 这里隐藏父目录栏、把预览栏压到 1/10，让文件列表尽量占满屏幕。

[mgr]
# 父目录栏 : 当前目录栏 : 预览栏
# 保留父目录栏便于导航，预览栏给到约 40% 宽度
ratio = [ 1, 4, 3 ]

# 行模式：显示文件大小与修改时间，信息更丰富
linemode = "size"

# 显示隐藏文件
show_hidden = true

# 目录优先排序
sort_by = "natural"
sort_dir_first = true

# 边框：圆角更柔和
[mgr]
# （ratio 已在上方定义，此处仅示意，实际合并到上面的 [mgr] 段）
