[general]
import = ["~/.config/alacritty/themes/catppuccin-frappe.toml"]
# --- 窗口设置 (Window) ---
[window]
# 窗口尺寸 (字符数) - 仅在浮动模式下有效
dimensions = { columns = 110, lines = 32 }

# 窗口内边距 (像素) - 留出更舒适的呼吸空间
padding = { x = 18, y = 16 }

# 动态内边距 - 窗口大小时是否自动调整
dynamic_padding = true

# 窗口装饰 - "None" 去掉标题栏 (Niri 会自己画边框，所以选 None 最干净)
# 可选: "Full" (带标题栏), "None" (无), "Transparent" (macOS专用)
decorations = "Full"

# 不透明度 (0.0 完全透明 - 1.0 完全不透明)
# 略微透出壁纸，同时维持代码与文本的对比度
opacity = 0.96
blur = true

# 启动模式
# "Windowed", "Maximized", "Fullscreen"
startup_mode = "Windowed"

# 窗口标题
title = "Alacritty终端"

# 窗口类名 (用于 Niri 的 window-rule 匹配)
class = { instance = "Alacritty", general = "Alacritty" }

# --- 滚动设置 (Scrolling) ---
[scrolling]
# 回滚缓冲区大小 (行数)
history = 10000
# 滚动倍率
multiplier = 3
# --- 字体设置 (Font) ---
[font]
# 确保你已安装: sudo pacman -S ttf-jetbrains-mono-nerd
size = 18.0

# 保持常规字重，粗体仅在需要强调时出现
[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

# --- 光标设置 (Cursor) ---
[cursor]
# 保持下划线样式，更贴合你的偏好
style = { shape = "Underline", blinking = "On" }

# 眨眼间隔 (毫秒)
blink_interval = 650

# --- 终端 Shell (Shell) ---
[terminal.shell]
program = "/usr/bin/fish"
# --- 鼠标设置 (Mouse) ---
[mouse]
# 点击并打开 URL 不需要按修饰键 (默认需按 Shift)
# 如果你希望按住 Shift 才能点击链接，把这里删掉或设为 "None"
bindings = [{ mouse = "Middle", action = "PasteSelection" }]

# --- 键盘绑定 (Key bindings) ---
# Alacritty 默认并没有 Ctrl+C/V 复制粘贴，需要手动绑定
[keyboard]
bindings = [
  # 复制/粘贴
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "V", mods = "Control|Shift", action = "Paste" },

  # 字体缩放
  { key = "Plus", mods = "Control", action = "IncreaseFontSize" },
  { key = "Minus", mods = "Control", action = "DecreaseFontSize" },
  { key = "Key0", mods = "Control", action = "ResetFontSize" },

  # 滚动
  { key = "PageUp", mods = "Shift", action = "ScrollPageUp" },
  { key = "PageDown", mods = "Shift", action = "ScrollPageDown" },
  { key = "Home", mods = "Shift", action = "ScrollToTop" },
  { key = "End", mods = "Shift", action = "ScrollToBottom" },
]

# --- 调试选项 (Debug) ---
[debug]
# 记录日志级别
log_level = "Warn"
# 渲染计时器 (调试性能时用)
render_timer = false
