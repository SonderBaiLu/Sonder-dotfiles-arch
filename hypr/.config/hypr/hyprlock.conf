# Hyprlock 锁屏界面配置。
# 配色与 Noctalia（Catppuccin Mocha 系）保持一致。

general {
    # 隐藏解锁进度条
    disable_loading_bar = true
    # 锁屏时隐藏光标
    hide_cursor = true
}

# 锁屏背景：所有显示器（monitor 留空）统一深色
background {
    monitor =
    color = rgb(1e1e2e)
}

# 密码输入框
input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(cba6f7)      # 外框（淡紫，Noctalia 主色）
    inner_color = rgb(1e1e2e)      # 内底（深色）
    font_color = rgb(cdd6f4)       # 输入文字颜色
    check_color = rgb(94e2d5)      # 校验成功提示色
    fail_color = rgb(f38ba8)       # 密码错误提示色
    fade_on_empty = false
    placeholder_text = 输入密码
    position = 0, -20
    halign = center
    valign = center
}
